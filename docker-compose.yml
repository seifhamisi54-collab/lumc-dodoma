services:
  db:
    image: postgis/postgis:16-3.4
    container_name: lumc_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
      POSTGRES_DB: ${DB_NAME:-tanzania_gis_db}
    volumes:
      - lumc_pgdata:/var/lib/postgresql/data
      - ./deploy/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Port NOT published to internet — Docker network only

  web:
    build: .
    container_name: lumc_web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - lumc_media:/app/media
      - lumc_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: lumc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - lumc_static:/var/www/static:ro
      - lumc_media:/var/www/media:ro
    depends_on:
      - web

volumes:
  lumc_pgdata:
  lumc_media:
  lumc_static:
