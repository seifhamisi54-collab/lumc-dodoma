# LUMC-Dodoma — Render FREE Blueprint
# Web = free. Databases = Neon free (PostGIS) — see deploy/DEPLOY_RENDER_FREE.md
# Dashboard: https://dashboard.render.com → New → Blueprint

services:
  - type: web
    name: lumc-dodoma
    runtime: docker
    plan: free
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_DEBUG
        value: "True"
      - key: SERVE_MEDIA
        value: "1"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,lumc-dodoma.onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DETAILED_DATABASE_URL
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://lumc-dodoma.onrender.com"
      - key: GIS_PORTAL_URL
        value: "https://lumc-dodoma.onrender.com"
      - key: DONATION_SITE_URL
        value: "https://lumc-dodoma.onrender.com"
      - key: SETUP_DEFAULT_USERS
        value: "1"
      - key: SETUP_USERS_RESET
        value: "1"
