# LUMC-Dodoma — Render FREE Blueprint
# Web = free. Databases = Neon free (PostGIS) — see deploy/DEPLOY_RENDER_FREE.md
# Dashboard: https://dashboard.render.com → New → Blueprint

services:
  - type: web
    name: lumc-dodoma
    runtime: docker
    plan: free
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: SERVE_MEDIA
        value: "1"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Paste Neon connection strings after Blueprint apply (Dashboard → Environment)
      - key: DATABASE_URL
        sync: false
      - key: DETAILED_DATABASE_URL
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GIS_PORTAL_URL
        sync: false
      - key: DONATION_SITE_URL
        sync: false
